<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VIVAFIT - Profile</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- Profile CSS -->
    <link rel="stylesheet" href="css/profile.css">

</head>


<body>


    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="fitness-bg">

        <i class="fa-solid fa-dumbbell dumbbell d1"></i>
        <i class="fa-solid fa-dumbbell dumbbell d2"></i>
        <i class="fa-solid fa-dumbbell dumbbell d3"></i>
        <i class="fa-solid fa-dumbbell dumbbell d4"></i>
        <i class="fa-solid fa-dumbbell dumbbell d5"></i>
        <i class="fa-solid fa-dumbbell dumbbell d6"></i>

        <div class="red-particle p1"></div>
        <div class="red-particle p2"></div>
        <div class="red-particle p3"></div>
        <div class="red-particle p4"></div>

    </div>



    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-dark">

        <div class="container-fluid px-4 px-md-5">

            <a
                class="navbar-brand brand-small"
                href="dashboard.html">

                <span class="mini-logo">V</span>

                VIVAFIT

            </a>


            <div class="d-flex align-items-center gap-4">

                <a
                    href="dashboard.html"
                    class="text-white text-decoration-none">

                    <i class="fa-solid fa-house"></i>
                    Home

                </a>


                <a
                    href="workouts.html"
                    class="text-white text-decoration-none">

                    <i class="fa-solid fa-dumbbell"></i>
                    Workouts

                </a>


                <a
                    href="planner.html"
                    class="text-white text-decoration-none">

                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Planner

                </a>


                <a
                    href="nutrition.html"
                    class="text-white text-decoration-none">

                    <i class="fa-solid fa-utensils"></i>
                    Nutrition

                </a>


                <a
                    href="progress.html"
                    class="text-white text-decoration-none">

                    <i class="fa-solid fa-chart-line"></i>
                    Progress

                </a>


                <a
                    href="profile.html"
                    class="text-white text-decoration-none">

                    <i class="fa-solid fa-user"></i>
                    Profile

                </a>

            </div>

        </div>

    </nav>



    <!-- =========================
         PROFILE
    ========================== -->

    <main class="profile-container">

        <div class="profile-content">


            <!-- TITLE -->

            <div class="profile-header">

                <span>VIVAFIT</span>

                <h1>MY PROFILE</h1>

                <p>
                    Manage your personal information
                </p>

            </div>



            <!-- PROFILE PICTURE -->

            <div class="profile-picture-section">

                <img
                    id="profileImage"
                    src="images/img.png"
                    alt="Profile Picture"
                    class="profile-image">


                <label
                    for="imageInput"
                    class="change-picture">

                    <i class="fa-solid fa-camera"></i>

                    Change Profile Picture

                </label>


                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden>

            </div>



            <!-- PROFILE FIELDS -->

            <div class="profile-fields">


                <!-- FULL NAME -->

                <div class="profile-field">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name">

                </div>



                <!-- PHONE -->

                <div class="profile-field">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number">

                </div>



                <!-- EMAIL -->

                <div class="profile-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email">

                </div>



                <!-- AGE -->

                <div class="profile-field">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age">

                </div>



                <!-- HEIGHT -->

                <div class="profile-field">

                    <label for="height">
                        Height
                    </label>

                    <input
                        type="number"
                        id="height"
                        placeholder="Enter your height in cm">

                </div>



                <!-- WEIGHT -->

                <div class="profile-field">

                    <label for="weight">
                        Weight
                    </label>

                    <input
                        type="number"
                        id="weight"
                        placeholder="Enter your weight in kg">

                </div>



                <!-- FITNESS GOAL -->

                <div class="profile-field">

                    <label for="goal">
                        Fitness Goal
                    </label>

                    <select id="goal">

                        <option value="">
                            Select your fitness goal
                        </option>

                        <option value="build-muscle">
                            Build Muscle
                        </option>

                        <option value="lose-weight">
                            Lose Weight
                        </option>

                        <option value="stay-fit">
                            Stay Fit
                        </option>

                        <option value="improve-fitness">
                            Improve Fitness
                        </option>

                    </select>

                </div>

            </div>



            <!-- MY WORKOUTS -->

            <div class="my-workouts-section">

                <h2 class="my-workouts-title">
                    <i class="fa-solid fa-dumbbell"></i>
                    MY WORKOUTS
                </h2>

                <div
                    id="savedWorkouts"
                    class="saved-workouts-grid">
                </div>

            </div>



            <!-- BUTTONS -->

            <div class="profile-actions">

                <button
                    type="button"
                    id="saveProfile"
                    class="profile-save">

                    <span id="saveText">
                        Save Changes
                    </span>

                    <i class="fa-solid fa-check"></i>

                </button>


                <p
                    id="saveMessage"
                    class="save-message">
                </p>


                <button
                    type="button"
                    id="logoutBtn"
                    class="logout-btn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </button>

            </div>


        </div>

    </main>



    <!-- JavaScript -->

    <script src="js/profile.js"></script>

</body>

</html>
