<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVAFIT - Progress</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- Progress CSS -->
    <link rel="stylesheet" href="css/progress.css">

    <!-- Adaptive Workout CSS -->
    <link rel="stylesheet" href="css/adaptive.css">
</head>

<body>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <div class="fitness-bg">
        <i class="fa-solid fa-dumbbell dumbbell d1"></i>
        <i class="fa-solid fa-dumbbell dumbbell d2"></i>
        <i class="fa-solid fa-dumbbell dumbbell d3"></i>
        <i class="fa-solid fa-dumbbell dumbbell d4"></i>
        <i class="fa-solid fa-dumbbell dumbbell d5"></i>
        <i class="fa-solid fa-dumbbell dumbbell d6"></i>

        <div class="red-particle p1"></div>
        <div class="red-particle p2"></div>
        <div class="red-particle p3"></div>
        <div class="red-particle p4"></div>
    </div>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-dark">
        <div class="container-fluid px-4 px-md-5">
            <a class="navbar-brand brand-small" href="dashboard.html">
                <span class="mini-logo">V</span>
                VIVAFIT
            </a>

            <div class="d-flex align-items-center gap-4">
                <a href="dashboard.html" class="text-white text-decoration-none">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
                <a href="workouts.html" class="text-white text-decoration-none">
                    <i class="fa-solid fa-dumbbell"></i>
                    Workouts
                </a>
                <a href="planner.html" class="text-white text-decoration-none">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Planner
                </a>
                <a href="nutrition.html" class="text-white text-decoration-none">
                    <i class="fa-solid fa-utensils"></i>
                    Nutrition
                </a>
                <a href="progress.html" class="text-white text-decoration-none">
                    <i class="fa-solid fa-chart-line"></i>
                    Progress
                </a>
                <a href="profile.html" class="text-white text-decoration-none">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </div>
        </div>
    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="progress-container">


        <!-- MOTIVATION QUOTE -->

        <div class="quote-banner">
            <i class="fa-solid fa-quote-left quote-icon"></i>
            <p class="quote-text" id="motivationQuote">Loading quote...</p>
        </div>


        <!-- STATS ROW -->

        <div class="stats-row">
            <div class="stat-card">
                <i class="fa-solid fa-dumbbell stat-icon"></i>
                <div class="stat-value" id="statWorkouts">0</div>
                <div class="stat-label">Total Workouts</div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-fire stat-icon"></i>
                <div class="stat-value" id="statStreak">0</div>
                <div class="stat-label">Day Streak</div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-weight-scale stat-icon"></i>
                <div class="stat-value" id="statWeightChange">--</div>
                <div class="stat-label">Weight Change</div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-arrow-up stat-icon"></i>
                <div class="stat-value" id="statLifts">0</div>
                <div class="stat-label">Lifts Logged</div>
            </div>
        </div>


        <!-- WEIGHT TRACKING -->

        <div class="progress-section">
            <div class="chart-card">
                <div class="section-header">
                    <i class="fa-solid fa-weight-scale"></i>
                    <h2>Weight Tracking</h2>
                    <span class="section-badge">LINE CHART</span>
                </div>

                <div class="chart-wrapper">
                    <canvas id="weightChart"></canvas>
                </div>

                <div class="log-form">
                    <div class="form-group">
                        <label for="weightDate">Date</label>
                        <input type="date" id="weightDate" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="weightInput">Weight (kg)</label>
                        <input type="number" id="weightInput" class="form-input" placeholder="e.g. 75.5" min="1" max="500" step="0.1">
                    </div>
                    <button type="button" id="logWeightBtn" class="log-btn">
                        <i class="fa-solid fa-plus"></i>
                        Log Weight
                    </button>
                </div>
                <p class="form-message" id="weightMsg"></p>
            </div>
        </div>


        <!-- TWO COLUMN: MEASUREMENTS + LIFTS -->

        <div class="two-col">

            <!-- BODY MEASUREMENTS -->

            <div class="progress-section">
                <div class="chart-card">
                    <div class="section-header">
                        <i class="fa-solid fa-ruler"></i>
                        <h2>Body Measurements</h2>
                    </div>

                    <div class="chart-wrapper">
                        <canvas id="measurementsChart"></canvas>
                    </div>

                    <div class="log-form">
                        <div class="form-group">
                            <label for="measureDate">Date</label>
                            <input type="date" id="measureDate" class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="chestInput">Chest (cm)</label>
                            <input type="number" id="chestInput" class="form-input" placeholder="cm" min="1" max="200" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="waistInput">Waist (cm)</label>
                            <input type="number" id="waistInput" class="form-input" placeholder="cm" min="1" max="200" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="armsInput">Arms (cm)</label>
                            <input type="number" id="armsInput" class="form-input" placeholder="cm" min="1" max="100" step="0.1">
                        </div>
                        <div class="form-group">
                            <label for="thighsInput">Thighs (cm)</label>
                            <input type="number" id="thighsInput" class="form-input" placeholder="cm" min="1" max="150" step="0.1">
                        </div>
                        <button type="button" id="logMeasureBtn" class="log-btn">
                            <i class="fa-solid fa-plus"></i>
                            Log
                        </button>
                    </div>
                    <p class="form-message" id="measureMsg"></p>
                </div>
            </div>

            <!-- SETS BREAKDOWN -->

            <div class="progress-section">
                <div class="chart-card">
                    <div class="section-header">
                        <i class="fa-solid fa-chart-pie"></i>
                        <h2>Sets Breakdown</h2>
                    </div>

                    <div class="chart-wrapper doughnut-wrapper">
                        <canvas id="setsChart"></canvas>
                    </div>
                </div>
            </div>

        </div>


        <!-- LIFT TRACKING -->

        <div class="progress-section">
            <div class="chart-card">
                <div class="section-header">
                    <i class="fa-solid fa-dumbbell"></i>
                    <h2>Lift Tracking</h2>
                    <span class="section-badge">BAR CHART</span>
                </div>

                <div class="chart-wrapper">
                    <canvas id="liftChart"></canvas>
                </div>

                <div class="log-form">
                    <div class="form-group">
                        <label for="liftDate">Date</label>
                        <input type="date" id="liftDate" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="exerciseSelect">Exercise</label>
                        <select id="exerciseSelect" class="form-input">
                            <option value="">Select exercise</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="liftWeightInput">Weight (kg)</label>
                        <input type="number" id="liftWeightInput" class="form-input" placeholder="kg" min="0" max="500" step="0.5">
                    </div>
                    <div class="form-group">
                        <label for="liftRepsInput">Reps</label>
                        <input type="number" id="liftRepsInput" class="form-input" placeholder="reps" min="1" max="100">
                    </div>
                    <div class="form-group">
                        <label for="normalSetsInput">Normal Sets</label>
                        <input type="number" id="normalSetsInput" class="form-input" placeholder="0" min="0" max="20" value="0">
                    </div>
                    <div class="form-group">
                        <label for="warmupSetsInput">Warmup Sets</label>
                        <input type="number" id="warmupSetsInput" class="form-input" placeholder="0" min="0" max="20" value="0">
                    </div>
                    <div class="form-group">
                        <label for="failureSetsInput">Failure Sets</label>
                        <input type="number" id="failureSetsInput" class="form-input" placeholder="0" min="0" max="20" value="0">
                    </div>
                    <button type="button" id="logLiftBtn" class="log-btn">
                        <i class="fa-solid fa-plus"></i>
                        Log Lift
                    </button>
                </div>
                <p class="form-message" id="liftMsg"></p>
            </div>
        </div>


        <!-- WORKOUTS PER WEEK -->

        <div class="progress-section">
            <div class="chart-card">
                <div class="section-header">
                    <i class="fa-solid fa-calendar-check"></i>
                    <h2>Workouts Per Week</h2>
                    <span class="section-badge">AUTO-TRACKED</span>
                </div>

                <div class="chart-wrapper">
                    <canvas id="workoutsPerWeekChart"></canvas>
                </div>
            </div>
        </div>


        <!-- ADAPTIVE INSIGHTS -->

        <div class="progress-section">
            <div class="chart-card">
                <div class="section-header">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <h2>Adaptive Insights</h2>
                    <span class="section-badge">SMART</span>
                </div>

                <div id="progressAdaptiveInsights"></div>
            </div>
        </div>


    </main>


    <!-- JavaScript -->
    <script src="js/adaptive.js"></script>
    <script src="js/progress.js"></script>

</body>

</html>
